# Actions are pinned to commit SHAs; this keeps the pins moving with their releases.
# No bun entry yet: Dependabot reads bun.lock only up to lockfileVersion 1, and ours is 2 (the updater fails).
# Socket reviews every dependency change on pull requests in the meantime. Add the bun entry back, with a
# 7-day cooldown and one group, once Dependabot supports lockfileVersion 2.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
