name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Called from release, `github.workflow` is the caller's name, so a release run never shares (and cancels) a
# push's group, and never takes its caller's own group either.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24   # tsdown needs >= 22.18 to build; the CLI itself runs on >= 22.12
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run generate:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:binary --target linux-x64
      - name: Run standalone binary without Node or Bun on PATH
        env:
          DATIN_TELEMETRY_DISABLED: "1"
        run: |
          binary="$PWD/dist/artifacts/linux-x64/datin"
          cd "$RUNNER_TEMP"
          PATH='' "$binary" --version
          PATH='' "$binary" commands --json
