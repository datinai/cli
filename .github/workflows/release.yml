name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Release tags must match the package version and belong to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(bun -p 'require("./packages/cli/package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          # Fully qualified: a tag named origin/main would win over the remote branch in a short-name lookup.
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: bun install --frozen-lockfile
      - name: Build and pack the npm distribution
        working-directory: packages/cli
        run: bun pm pack --filename "$RUNNER_TEMP/datin.tgz"
      - name: Install and run the tarball outside the workspace
        env:
          DATIN_TELEMETRY_DISABLED: "1"
        run: |
          version="$(bun -p 'require("./packages/cli/package.json").version')"
          mkdir "$RUNNER_TEMP/datin-install"
          cd "$RUNNER_TEMP/datin-install"
          echo '{"private":true}' > package.json
          bun add "$RUNNER_TEMP/datin.tgz"
          test "$(node_modules/.bin/datin --version)" = "$version"
          node_modules/.bin/datin commands --json > commands.json
          jq -e '.ok == true and (.data.commands | length > 0)' commands.json
          node_modules/.bin/datin agent instructions codex --json > instructions.json
          jq -e '.ok == true and .data.agent == "codex" and (.data.markdown | length > 0)' instructions.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/datin.tgz
          if-no-files-found: error
          retention-days: 3

  build:
    needs: check
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15, ext: "" }
          - { target: darwin-x64, runner: macos-15-intel, ext: "" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, ext: "" }
          - { target: linux-x64, runner: ubuntu-24.04, ext: "" }
          - { target: windows-arm64, runner: windows-11-arm, ext: .exe }
          - { target: windows-x64, runner: windows-2025, ext: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:binary --target ${{ matrix.target }}
      - name: Run outside the checkout without Node or Bun on PATH
        env:
          DATIN_TELEMETRY_DISABLED: "1"
        run: |
          binary="$PWD/dist/artifacts/${{ matrix.target }}/datin${{ matrix.ext }}"
          cd "$RUNNER_TEMP"
          PATH='' "$binary" --version
          PATH='' "$binary" commands --json
      - name: Archive binary with executable permissions
        run: tar -czf dist/datin-${{ matrix.target }}.tar.gz -C dist/artifacts/${{ matrix.target }} datin${{ matrix.ext }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datin-${{ matrix.target }}
          path: dist/datin-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [package, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - name: Allow a retry only when the published tarball is identical
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.slice(1);
          const response = await fetch(`https://registry.npmjs.org/datin/${version}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            if (!response.ok) throw new Error(`Registry returned ${response.status}`);
            const metadata = await response.json();
            const integrity = `sha512-${createHash('sha512').update(readFileSync('datin.tgz')).digest('base64')}`;
            if (metadata.dist?.integrity !== integrity) throw new Error('This version already exists with different contents');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          JS
      - name: Publish the verified tarball
        if: steps.registry.outputs.published != 'true'
        # npm supports OIDC; Bun owns dependency installation, builds and packing. Trusted publishing needs
        # npm 11.5.1 or later. Provenance stays off while this repository is private (npm requires a public
        # source repository for it); turn it on when the repository goes public.
        run: |
          node --input-type=module -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1))))
              throw new Error('Trusted publishing needs npm 11.5.1 or later, found ' + process.argv[1]);
          " "$(npm --version)"
          npm publish datin.tgz --access public --tag latest --ignore-scripts --provenance=false
      - name: Verify the published version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # npm can accept a publish several minutes before the registry serves it.
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 \
            --retry-max-time 330 --connect-timeout 10 --max-time 15 \
            --output "$RUNNER_TEMP/published.json" "https://registry.npmjs.org/datin/$version"
          jq -e --arg version "$version" '.name == "datin" and .version == $version' \
            "$RUNNER_TEMP/published.json"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: datin-*
          merge-multiple: true
          path: binaries
      - name: Keep all six standalone builds on the tagged GitHub release, with their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd binaries && sha256sum datin-*.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" binaries/*.tar.gz binaries/SHA256SUMS --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
